<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>JCN | Stock Management</title>

  <link
    rel="stylesheet"
    href="../css/stock-management.css"
  >

  <script
    defer
    src="../js/stock-management.js"
  ></script>
</head>

<body data-page="stock-management">
  <div class="container">

    <header class="topbar">
      <a href="inventory-product.html" class="brand">
        <span aria-hidden="true">▣</span>
        JCN Inventory
      </a>

      <nav aria-label="Main navigation">
        <a href="inventory-product.html">
          Products
        </a>

        <a
          href="stock-management.html"
          class="active"
          aria-current="page"
        >
          Stock
        </a>

        <a href="order-preparation.html">
          Orders
        </a>

        <a href="stock-history.html">
          History
        </a>
      </nav>

      <span class="staff staff-badge">
        Inventory Staff
      </span>
    </header>

    <section class="page-heading">
      <small>INVENTORY MANAGEMENT</small>

      <h1>Stock Management</h1>

      <p>
        Monitor available apparel and record stock adjustments.
      </p>
    </section>

    <div class="layout">
      <aside class="panel sidebar">
        <h2>Inventory Menu</h2>

        <nav aria-label="Inventory menu">
          <a href="inventory-product.html">
            Manage Products
          </a>

          <a
            href="stock-management.html"
            class="active"
            aria-current="page"
          >
            Stock Management
          </a>

          <a href="order-preparation.html">
            Order Preparation
          </a>

          <a href="stock-history.html">
            Stock History
          </a>
        </nav>
      </aside>

      <!-- Live content is loaded by stock-management.js -->
      <main id="main" aria-label="Stock management">
        <section class="panel">
          <p role="status">Loading inventory…</p>
        </section>
      </main>
    </div>
  </div>

  <!-- The adjustment form is generated by JavaScript -->
  <dialog
    id="modal"
    aria-label="Adjust stock"
  ></dialog>

  <div
    id="notification"
    role="status"
    aria-live="polite"
    aria-atomic="true"
  ></div>

  <noscript>
    <p>Please enable JavaScript to use Stock Management.</p>
  </noscript>
</body>
</html>
