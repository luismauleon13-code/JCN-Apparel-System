<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JCN | Cart</title>

  <link rel="stylesheet" href="customer-cart.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

<aside class="sidebar">
  <div class="brand">
    <div class="logo">J</div>
    <div>
      <h2>JCN</h2>
      <p>Apparel Printing</p>
    </div>
  </div>

  <nav class="menu">
    <a href="dashboard.html"><i class="fa-solid fa-house"></i> Home</a>
    <a href="customer-shop.html"><i class="fa-solid fa-shirt"></i> Shop Products</a>
    <a href="customer-customize.html"><i class="fa-solid fa-palette"></i> Customization</a>
    <a href="customer-notifications.html"><i class="fa-solid fa-bullhorn"></i> Notifications</a>
    <a href="customer-cart.html" class="active"><i class="fa-solid fa-cart-shopping"></i> Cart</a>
    <a href="customer-orders.html"><i class="fa-solid fa-box"></i> Orders</a>
    <a href="customer-profile.html"><i class="fa-solid fa-user"></i> Profile</a>
  </nav>

  <button id="logoutBtn" class="logout-btn">
    <i class="fa-solid fa-right-from-bracket"></i> Logout
  </button>
</aside>

<main class="main">
  <header class="topbar">
    <div>
      <p>JCN CUSTOMER CART</p>
      <h1>My Cart</h1>
    </div>

    <a href="customer-shop.html" class="shop-btn">
      <i class="fa-solid fa-arrow-left"></i> Continue Shopping
    </a>
  </header>

  <section class="cart-layout">
    <div class="cart-panel">
      <div class="panel-header">
        <h2>Selected Products</h2>
        <span id="cartCount">0 item(s)</span>
      </div>

      <div id="cartItems" class="cart-items">
        <p class="empty">Your cart is empty.</p>
      </div>
    </div>

    <div class="summary-panel">
      <h2>Checkout Summary</h2>

      <div class="summary-row">
        <span>Subtotal</span>
        <strong id="subtotal">₱0.00</strong>
      </div>

      <div class="summary-row">
        <span>Delivery Fee</span>
        <strong id="deliveryFee">₱80.00</strong>
      </div>

      <div class="summary-row total">
        <span>Total</span>
        <strong id="grandTotal">₱0.00</strong>
      </div>

      <label>Payment Method</label>
      <select id="paymentMethod">
        <option value="COD">Cash on Delivery</option>
        <option value="PayPal">PayPal</option>
      </select>

      <button id="checkoutBtn" class="checkout-btn">
        Proceed to Checkout
      </button>

      <button id="continueBtn" class="continue-btn">
        Continue Shopping
      </button>
    </div>
  </section>
</main>

<script src="customer-cart.js"></script>
</body>
</html>
