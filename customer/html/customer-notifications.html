<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JCN | Notifications</title>

  <link rel="stylesheet" href="../css/customer-notifications.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

<aside class="sidebar">
  <div class="brand">
    <div class="logo">J</div>
    <div>
      <h2>JCN</h2>
      <p>Apparel Printing</p>
    </div>
  </div>

  <nav class="menu">
    <a href="dashboard.html"><i class="fa-solid fa-house"></i> Home</a>
    <a href="customer-shop.html"><i class="fa-solid fa-shirt"></i> Shop Products</a>
    <a href="customer-customize.html"><i class="fa-solid fa-palette"></i> Customization</a>
    <a href="customer-notifications.html" class="active"><i class="fa-solid fa-bullhorn"></i> Notifications</a>
    <a href="customer-cart.html"><i class="fa-solid fa-cart-shopping"></i> Cart</a>
    <a href="customer-orders.html"><i class="fa-solid fa-box"></i> Orders</a>
    <a href="customer-profile.html"><i class="fa-solid fa-user"></i> Profile</a>
  </nav>

  <button id="customerLogoutBtn" class="logout-btn">
  <i class="fas fa-sign-out-alt"></i>
  Logout
</button>
</aside>

<main class="main">
  <header class="topbar">
    <div>
      <p>JCN ANNOUNCEMENTS</p>
      <h1>Announcements</h1>
    </div>
  </header>

  <section class="announcement-layout">

    <div class="announcement-list-panel">
      <div class="panel-header">
        <h2>Latest Announcements</h2>
        <span id="announcementCount">0</span>
      </div>

      <div id="announcementList" class="announcement-list">
        <p class="empty">Loading announcements...</p>
      </div>
    </div>

    <div class="details-panel">
      <h2>Announcement Details</h2>

      <div id="announcementDetails">
        <p class="empty">
          Select an announcement to read details.
        </p>
      </div>
    </div>

  </section>
</main>

<div id="customerLogoutModal" class="customer-logout-modal hidden">
  <div class="modal-overlay"></div>

  <div class="modal-box">
    <h4>Confirm Logout</h4>
    <p>Are you sure you want to log out?</p>

    <div class="logout-modal-actions">
      <button id="customerConfirmLogout" class="modal-confirm-btn">
        Yes, Logout
      </button>

      <button id="customerCancelLogout" class="modal-cancel-btn">
        Cancel
      </button>
    </div>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const logoutBtn = document.getElementById("customerLogoutBtn");
  const logoutModal = document.getElementById("customerLogoutModal");
  const confirmBtn = document.getElementById("customerConfirmLogout");
  const cancelBtn = document.getElementById("customerCancelLogout");

  logoutBtn.addEventListener("click", function (e) {
    e.preventDefault();
    logoutModal.classList.remove("hidden");
  });

  cancelBtn.addEventListener("click", function () {
    logoutModal.classList.add("hidden");
  });

  confirmBtn.addEventListener("click", function () {
    localStorage.removeItem("customerToken");
    localStorage.removeItem("customerUser");
    localStorage.removeItem("customerCart");

    window.location.href = "index.html";
  });
});
</script>


<script src="../js/customer-notifications.js"></script>
</body>
</html>
