<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JCN | User Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../../admin/css/style.css" />
</head>
<body class="auth-page">

  <div class="auth-overlay"></div>

  <div class="container min-vh-100 d-flex justify-content-center align-items-center py-4 position-relative">
    <div class="premium-auth-card p-4 p-md-5 w-100">
      <div class="text-center mb-4">
        <img src="../../logo.png" alt="JCN Logo" class="auth-logo mb-3">
        <p class="auth-brand-mini mb-2">JCN APPAREL PRINTING SERVICES</p>
        <h1 class="premium-auth-title">USER SIGN IN</h1>
        <p class="premium-auth-subtitle mb-0">Access your account and continue your custom printing journey.</p>
      </div>

      <form id="userLoginForm">
        <div class="premium-input-group mb-3">
          <label class="premium-label">Username</label>
          <div class="premium-input-wrap">
            <i class="fa-solid fa-user"></i>
            <input type="text" class="form-control premium-input" id="loginUsername" placeholder="Enter username">
          </div>
        </div>

        <div class="premium-input-group mb-2">
          <label class="premium-label">Password</label>
          <div class="premium-input-wrap">
  <i class="fa-solid fa-lock"></i>

  <input
    type="password"
    class="form-control premium-input"
    id="loginPassword"
    placeholder="Enter password"
  >

 <button
  type="button"
  class="password-eye-btn"
  data-target="loginPassword"
>
  <i class="fa-solid fa-eye-slash"></i>
</button>
</div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3 auth-links-row">
          <a href="../../admin/html/admin-login.html"
   class="gold-link small fw-semibold">
   Admin Login
</a>
          <a href="#" class="gold-link small fw-semibold" id="forgotPasswordBtn">Forgot Password?</a>
        </div>

        <div id="customerResetModal" class="reset-modal hidden">
  <div class="reset-box">
    <h2>Reset Password</h2>
    <p id="customerResetText">Enter your email to receive OTP.</p>

    <input type="email" id="customerResetEmail" placeholder="Email address">
    <input type="text" id="customerResetOtp" class="hidden" placeholder="Enter OTP">
    <input type="password" id="customerResetNewPassword" class="hidden" placeholder="New password">
    <input type="password" id="customerResetConfirmPassword" class="hidden" placeholder="Confirm password">

    <p id="customerResetMessage"></p>

    <div class="reset-actions">
      <button type="button" id="customerCancelResetBtn">Cancel</button>
      <button type="button" id="customerResetNextBtn">Send OTP</button>
    </div>
  </div>
</div>

<div id="customerSuccessModal" class="success-modal hidden">
  <div class="success-box">
    <div class="success-icon">
      <i class="fa-solid fa-check"></i>
    </div>

    <h2>Success</h2>
    <p>Password reset successful. You can now login.</p>

    <button type="button" id="customerSuccessOkBtn">
      Continue
    </button>
  </div>
</div>

        

        <p id="userLoginMessage" class="small text-center mb-3"></p>

        <div class="d-grid mb-3">
          <button type="submit" class="premium-main-btn">Sign In</button>
        </div>

        <p class="text-center text-light mb-0">
          New to JCN?
          <a href="../../user-register.html" class="gold-link fw-semibold">Create Account</a>
        </p>

        <div class="text-center mt-3">
          <a href="../../index.html" class="back-home-link">← Back to Home</a>
        </div>
      </form>
    </div>
  </div>

  <script src="../../admin/js/script.js"></script>
</body>
</html>
