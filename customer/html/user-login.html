<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JCN | User Login</title>

  <!-- BOOTSTRAP -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- FONT AWESOME -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  >

  <!-- SHARED CSS -->
  <link rel="stylesheet" href="../../admin/css/style.css">
</head>

<body class="auth-page" data-page="customer-login">

  <div class="auth-overlay" aria-hidden="true"></div>

  <main
    class="container min-vh-100 d-flex justify-content-center align-items-center py-4 position-relative"
  >
    <div class="premium-auth-card p-4 p-md-5 w-100">

      <!-- HEADER -->
      <div class="text-center mb-4">
        <img
          src="../../logo.png"
          alt="JCN Logo"
          class="auth-logo mb-3"
        >

        <p class="auth-brand-mini mb-2">
          JCN APPAREL PRINTING SERVICES
        </p>

        <h1 class="premium-auth-title">
          USER SIGN IN
        </h1>

        <p class="premium-auth-subtitle mb-0">
          Access your account and continue your custom printing journey.
        </p>
      </div>

      <!-- CUSTOMER LOGIN -->
      <form id="userLoginForm" method="post">

        <!-- USERNAME -->
        <div class="premium-input-group mb-3">
          <label for="loginUsername" class="premium-label">
            Username
          </label>

          <div class="premium-input-wrap">
            <i class="fa-solid fa-user" aria-hidden="true"></i>

            <input
              type="text"
              class="form-control premium-input"
              id="loginUsername"
              name="username"
              placeholder="Enter username"
              autocomplete="username"
              autocapitalize="none"
              spellcheck="false"
              required
            >
          </div>
        </div>

        <!-- PASSWORD -->
        <div class="premium-input-group mb-2">
          <label for="loginPassword" class="premium-label">
            Password
          </label>

          <div class="premium-input-wrap">
            <i class="fa-solid fa-lock" aria-hidden="true"></i>

            <input
              type="password"
              class="form-control premium-input"
              id="loginPassword"
              name="password"
              placeholder="Enter password"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="password-eye-btn"
              data-target="loginPassword"
              aria-label="Show password"
              aria-controls="loginPassword"
            >
              <i class="fa-solid fa-eye" aria-hidden="true"></i>
            </button>
          </div>
        </div>

        <!-- LINKS -->
        <div
          class="d-flex justify-content-between align-items-center mb-3 auth-links-row"
        >
          <a
            href="../../admin/html/admin-login.html"
            class="gold-link small fw-semibold"
          >
            Admin Login
          </a>

          <a
            href="#customerResetModal"
            class="gold-link small fw-semibold"
            id="forgotPasswordBtn"
          >
            Forgot Password?
          </a>
        </div>

        <!-- MESSAGE -->
        <p
          id="userLoginMessage"
          class="small text-center mb-3"
          role="status"
          aria-live="polite"
        ></p>

        <!-- SUBMIT -->
        <div class="d-grid mb-3">
          <button type="submit" class="premium-main-btn">
            Sign In
          </button>
        </div>

        <!-- REGISTER -->
        <p class="text-center text-light mb-0">
          New to JCN?

          <a
            href="../../user-register.html"
            class="gold-link fw-semibold"
          >
            Create Account
          </a>
        </p>

        <!-- HOME -->
        <div class="text-center mt-3">
          <a href="../../index.html" class="back-home-link">
            <i class="fa-solid fa-arrow-left me-1" aria-hidden="true"></i>
            Back to Home
          </a>
        </div>

      </form>
    </div>
  </main>

  <!-- CUSTOMER PASSWORD RESET -->
  <div
    id="customerResetModal"
    class="reset-modal hidden"
    role="dialog"
    aria-modal="true"
    aria-labelledby="customerResetTitle"
    aria-hidden="true"
  >
    <div class="reset-box">
      <h2 id="customerResetTitle">Reset Password</h2>

      <p id="customerResetText">
        Enter your email to receive OTP.
      </p>

      <input
        type="email"
        id="customerResetEmail"
        placeholder="Email address"
        aria-label="Email address"
        autocomplete="email"
      >

      <input
        type="text"
        id="customerResetOtp"
        class="hidden"
        placeholder="Enter OTP"
        aria-label="One-time password"
        inputmode="numeric"
        autocomplete="one-time-code"
      >

      <input
        type="password"
        id="customerResetNewPassword"
        class="hidden"
        placeholder="New password"
        aria-label="New password"
        autocomplete="new-password"
      >

      <input
        type="password"
        id="customerResetConfirmPassword"
        class="hidden"
        placeholder="Confirm password"
        aria-label="Confirm new password"
        autocomplete="new-password"
      >

      <p
        id="customerResetMessage"
        role="status"
        aria-live="polite"
      ></p>

      <div class="reset-actions">
        <button type="button" id="customerCancelResetBtn">
          Cancel
        </button>

        <button type="button" id="customerResetNextBtn">
          Send OTP
        </button>
      </div>
    </div>
  </div>

  <!-- CUSTOMER RESET SUCCESS -->
  <div
    id="customerSuccessModal"
    class="success-modal hidden"
    role="dialog"
    aria-modal="true"
    aria-labelledby="customerSuccessTitle"
    aria-hidden="true"
  >
    <div class="success-box">
      <div class="success-icon">
        <i class="fa-solid fa-check" aria-hidden="true"></i>
      </div>

      <h2 id="customerSuccessTitle">Success</h2>

      <p>
        Password reset successful. You can now login.
      </p>

      <button type="button" id="customerSuccessOkBtn">
        Continue
      </button>
    </div>
  </div>

  <!-- SHARED ADMIN + CUSTOMER LOGIN SCRIPT -->
  <script src="../../admin/js/script.js?v=5"></script>

</body>
</html>
