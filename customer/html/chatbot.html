
<!-- FLOATING CHAT BUTTON -->
<button
  class="jcn-chat-toggle"
  id="jcnChatToggle"
  aria-label="Open JCN AI Assistant"
>
  <i class="fa-solid fa-comments"></i>

  <span class="jcn-chat-online"></span>
</button>


<!-- CHATBOT WINDOW -->
<div
  class="jcn-chat-window"
  id="jcnChatWindow"
>

  <!-- HEADER -->
  <div class="jcn-chat-header">

    <div class="jcn-ai-avatar">
      <img
        src="../../logo.png"
        alt="JCN Logo"
      >
    </div>

    <div class="jcn-chat-title">

      <h4>JCN AI Assistant</h4>

      <p>
        <span>●</span>
        Online • Ready to assist
      </p>

    </div>

    <button
      class="jcn-chat-close"
      id="jcnChatClose"
      type="button"
    >
      <i class="fa-solid fa-xmark"></i>
    </button>

  </div>


  <!-- CHAT MESSAGES -->
  <div
    class="jcn-chat-messages"
    id="jcnChatMessages"
  >
  </div>


  <!-- QUICK QUESTIONS -->
  <div class="jcn-quick-actions">

    <button
      class="jcn-quick-btn"
      type="button"
      data-message="What products do you offer?"
    >
      👕 Products
    </button>


    <button
      class="jcn-quick-btn"
      type="button"
      data-message="How can I customize a shirt?"
    >
      ✨ Customize
    </button>


    <button
      class="jcn-quick-btn"
      type="button"
      data-message="What sizes are available?"
    >
      📏 Sizes
    </button>


    <button
      class="jcn-quick-btn"
      type="button"
      data-message="How can I track my order?"
    >
      📦 Track Order
    </button>

  </div>


  <!-- INPUT AREA -->
  <div class="jcn-chat-input-wrapper">

    <div class="jcn-chat-input-box">

      <input
        type="text"
        id="jcnChatInput"
        placeholder="Ask JCN AI..."
        autocomplete="off"
      >


      <button
        class="jcn-send-btn"
        id="jcnSendButton"
        type="button"
      >
        <i class="fa-solid fa-paper-plane"></i>
      </button>

    </div>

  </div>

</div>
