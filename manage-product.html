<!-- ADD PRODUCT MODAL -->
<div class="modal fade" id="addProductModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content custom-modal">
      <form id="addProductForm" enctype="multipart/form-data">

        <div class="modal-header border-0">
          <h5 class="modal-title text-light">Add New Product</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">

          <div class="mb-3">
            <label class="form-label">Product Title</label>
            <input type="text" id="productTitle" class="form-control custom-input" placeholder="Enter product title" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Price</label>
            <input type="number" id="productPrice" class="form-control custom-input" placeholder="Enter price" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Product Type</label>
            <select id="productCategory" class="form-control custom-input" required>
              <option value="T-Shirt">T-Shirt</option>
              <option value="Hoodie">Hoodie</option>
              <option value="Sweatshirt">Sweatshirt</option>
              <option value="Polo Shirt">Polo Shirt</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea id="productDescription" class="form-control custom-input" rows="3" placeholder="Enter description"></textarea>
          </div>

          <div class="mb-3">

  <label class="form-label">Product Image</label>

  <div class="image-upload-box">

    <input
      type="file"
      id="productImage"
      name="product_image"
      accept="image/*"
      class="d-none"
    >

    <label for="productImage" class="upload-preview">

      <div class="upload-placeholder" id="uploadPlaceholder">
        <i class="fa-solid fa-image"></i>

        <span>
          Click here to upload product image
        </span>

        <small>
          PNG, JPG, JPEG
        </small>
      </div>

      <img
        id="previewImage"
        src=""
        alt="Preview"
      >

    </label>

  </div>

</div>

        </div>

        <div class="modal-footer border-0">
          <button type="button" class="btn btn-outline-warning text-gold border-gold" data-bs-dismiss="modal">
            Cancel

            Save Product

<!-- LOGOUT MODAL -->

      <button id="adminConfirmLogout" class="btn btn-gold w-100">Yes, Logout</button>
      <button id="adminCancelLogout" class="btn btn-outline-warning text-gold border-gold w-100">Cancel</button>
    </div>
  </div>
</div>

<script>
const PRODUCTS_API = "http://localhost:5000/api/admin/products";

const defaultColors = [
  "Black",
  "White",
  "Mustard",
  "Army Green",
  "Navy Blue",
  "Maroon",
  "Pink",
  "Rust",
  "Fatigue",
  "Taupe",
  "Blue",
  "Gray",
  "Peach",
  "Dark Green",
  "Deep Royal",
  "Mint",
  "Red",
  "Brown",
  "Rose"
];

const defaultSizes = [
  { size: "XS", length: "27", width: "21", sleeve: "9" },
  { size: "S", length: "28", width: "22", sleeve: "9.25" },
  { size: "M", length: "29", width: "23", sleeve: "9.5" },
  { size: "L", length: "30", width: "24", sleeve: "10.25" },
  { size: "XL", length: "31", width: "25", sleeve: "10.5" },
  { size: "2XL", length: "32", width: "26", sleeve: "11" },
  { size: "3XL", length: "33", width: "27", sleeve: "11.5" }
];

function peso(value) {
  return "₱" + Number(value || 0).toLocaleString();
}

async function loadProducts() {
  const container = document.getElementById("productsContainer");

  try {
    const res = await fetch(PRODUCTS_API);
    const data = await res.json();

    container.innerHTML = "";

    if (!data.products || data.products.length === 0) {
      container.innerHTML = `<p class="text-secondary">No products added yet.</p>`;
      return;
    }

    data.products.forEach(product => {
      const now = new Date();

const saleEnd = product.sale_end
  ? new Date(product.sale_end)
  : null;

const saleExpired =
  saleEnd && saleEnd < now;

const sale =
  saleExpired
    ? 0
    : Number(product.sale_percent || 0);

const originalPrice = Number(product.price || 0);
const discountedPrice = originalPrice - (originalPrice * sale / 100);

      container.innerHTML += `
        <div class="product-card">
          <div class="product-img">
            ${
              product.product_image
                ? `<img src="${product.product_image}" alt="${product.title}" style="width:100%;height:180px;object-fit:cover;border-radius:16px;">`
                : `<i class="fa-solid fa-shirt"></i>`
            }
          </div>

          <div class="product-info">
            <small class="text-gold fw-bold">${product.category || "Product"}</small>
            <h5>${product.title || product.name || "Untitled Product"}</h5>
            <p>${product.description || "No description available."}</p>

           <div class="product-price">
            ${
  sale > 0
    ? `
      <small class="text-danger d-block mb-2">
        Sale ends:
        ${new Date(product.sale_end).toLocaleDateString()}
      </small>

      <small style="text-decoration:line-through;color:#aaa;">
        ${peso(originalPrice)}
      </small>

      <br>

      <span class="text-gold fw-bold">
        ${peso(discountedPrice)}
      </span>

      <small class="text-gold">
        ${sale}% OFF
      </small>
    `
    : `
      <span class="text-gold fw-bold">
        ${peso(originalPrice)}
      </span>
    `
}
</div>

            <div class="product-actions">
              <button class="btn-product-action btn-sale-product" onclick="addSale('${product.id}')">
                <i class="fa-solid fa-percent"></i>
                <span>Add Sale</span>
              </button>

              <button class="btn-product-action btn-delete-product" onclick="deleteProduct('${product.id}')">
                <i class="fa-solid fa-trash"></i>
                <span>Delete</span>
              </button>
            </div>
          </div>
        </div>
      `;
    });

  } catch (error) {
    console.error(error);
    container.innerHTML = `<p class="text-danger">Cannot load products. Make sure backend is running.</p>`;
  }
}

document.getElementById("addProductForm").addEventListener("submit", async function (e) {
  e.preventDefault();

  const formData = new FormData();

  formData.append("title", document.getElementById("productTitle").value.trim());
  formData.append("price", document.getElementById("productPrice").value.trim());
  formData.append("category", document.getElementById("productCategory").value);
  formData.append("description", document.getElementById("productDescription").value.trim());
  formData.append("colors", JSON.stringify(defaultColors));
  formData.append("sizes", JSON.stringify(defaultSizes));

  const image = document.getElementById("productImage").files[0];

  if (image) {
    formData.append("product_image", image);
  }

  try {
    const res = await fetch(PRODUCTS_API, {
      method: "POST",
      body: formData
    });

    const data = await res.json();
    alert(data.message || "Product saved.");

    if (data.success) {
      document.getElementById("addProductForm").reset();

      const modal = bootstrap.Modal.getInstance(document.getElementById("addProductModal"));
      modal.hide();

      loadProducts();
    }

  } catch (error) {
    console.error(error);
    alert("Cannot save product. Make sure backend is running.");
  }
});

async function deleteProduct(id) {
  if (!confirm("Delete this product?")) return;

  const res = await fetch(`${PRODUCTS_API}/${id}`, {
    method: "DELETE"
  });

  const data = await res.json();
  alert(data.message || "Product deleted.");
  loadProducts();
}

async function addSale(id) {

  const sale = prompt(
    "Enter discount percentage."
  );

  if (!sale) return;

  const saleEnd = prompt(
    "Enter sale end date.\nFormat: YYYY-MM-DD"
  );

  if (!saleEnd) return;

  const endDate = new Date(
    saleEnd + "T23:59:59"
  );

  if (isNaN(endDate.getTime())) {

    alert("Invalid date format.");

    return;
  }

  const res = await fetch(
    `${PRODUCTS_API}/${id}/sale`,
    {
      method: "PATCH",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        sale_percent: Number(sale),
        sale_end: endDate.toISOString()
      })
    }
  );

  const data = await res.json();

  alert(data.message);

  loadProducts();
}
/* LOGOUT */
const adminLogoutBtn = document.getElementById("adminLogoutBtn");
const adminLogoutModal = document.getElementById("adminLogoutModal");
const adminConfirmLogout = document.getElementById("adminConfirmLogout");
const adminCancelLogout = document.getElementById("adminCancelLogout");

adminLogoutBtn.addEventListener("click", () => {
  adminLogoutModal.classList.remove("hidden");
});

adminCancelLogout.addEventListener("click", () => {
  adminLogoutModal.classList.add("hidden");
});

adminConfirmLogout.addEventListener("click", () => {
  localStorage.removeItem("adminToken");
  localStorage.removeItem("adminUser");
  window.location.href = "index.html";
});

loadProducts();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
