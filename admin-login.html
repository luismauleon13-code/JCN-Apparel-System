<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JCN | Admin Login</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link rel="stylesheet" href="style.css" />
</head>

<body class="auth-page">

  <div class="auth-overlay"></div>

  <div class="container min-vh-100 d-flex justify-content-center align-items-center py-4 position-relative">

    <div class="premium-auth-card p-4 p-md-5 w-100">

      <div class="text-center mb-4">
        <img src="logo.png" alt="JCN Logo" class="auth-logo mb-3">

        <p class="auth-brand-mini mb-2">
          JCN APPAREL PRINTING SERVICES
        </p>

        <h1 class="premium-auth-title">
          ADMIN SIGN IN
        </h1>

        <p class="premium-auth-subtitle mb-0">
          Login as administrator to manage orders, customers, and printing services.
        </p>
      </div>

      <form id="adminLoginForm">

        <div class="premium-input-group mb-3">
          <label class="premium-label">Admin Username</label>

          <div class="premium-input-wrap">
            <i class="fa-solid fa-user-shield"></i>

            <input
              type="text"
              class="form-control premium-input"
              id="adminUsername"
              placeholder="Enter admin username"
            >
          </div>
        </div>

        <div class="premium-input-group mb-2">
          <label class="premium-label">Password</label>

          <div class="premium-input-wrap">
            <i class="fa-solid fa-lock"></i>

            <input
              type="password"
              class="form-control premium-input"
              id="adminPassword"
              placeholder="Enter password"
            >
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3 auth-links-row">

          <a href="user-login.html" class="gold-link small fw-semibold">
            User Login
          </a>

          <a href="#" class="gold-link small fw-semibold">
            Forgot Password?
          </a>

        </div>

        <p id="adminLoginMessage" class="small text-center mb-3"></p>

        <div class="d-grid mb-3">
          <button type="submit" class="premium-main-btn">
            Admin Sign In
          </button>
        </div>

        <div class="text-center mt-3">
          <a href="index.html" class="back-home-link">
            ← Back to Home
          </a>
        </div>

      </form>

    </div>
  </div>

  <script src="script.js"></script>

</body>
</html>
