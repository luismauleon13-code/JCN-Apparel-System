<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JCN | Register</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link rel="stylesheet" href="admin/css/style.css" />
</head>

<body class="auth-page">

  <div class="auth-overlay"></div>

  <div class="container min-vh-100 d-flex justify-content-center align-items-center py-4 position-relative">
    <div class="premium-auth-card p-4 p-md-5 w-100">

      <div class="text-center mb-4">
        <img src="logo.png" alt="JCN Logo" class="auth-logo mb-3">

        <p class="auth-brand-mini mb-2">
          JCN APPAREL PRINTING SERVICES
        </p>

        <h1 class="premium-auth-title">
          CREATE ACCOUNT
        </h1>

        <p class="premium-auth-subtitle mb-0">
          Register to start customizing, uploading, and ordering your apparel designs.
        </p>
      </div>

      <form id="userRegisterForm">

        <div class="premium-input-group mb-3">
          <label class="premium-label">First Name</label>
          <div class="premium-input-wrap">
            <i class="fa-solid fa-user"></i>
            <input type="text" class="form-control premium-input" id="registerFirstName" placeholder="Enter first name" required>
          </div>
        </div>

        <div class="premium-input-group mb-3">
          <label class="premium-label">
            Middle Name <span class="optional-text">(Optional)</span>
          </label>
          <div class="premium-input-wrap">
            <i class="fa-solid fa-user"></i>
            <input type="text" class="form-control premium-input" id="registerMiddleName" placeholder="Enter middle name">
          </div>
        </div>

        <div class="premium-input-group mb-3">
          <label class="premium-label">Last Name</label>
          <div class="premium-input-wrap">
            <i class="fa-solid fa-user"></i>
            <input type="text" class="form-control premium-input" id="registerLastName" placeholder="Enter last name" required>
          </div>
        </div>

        <div class="premium-input-group mb-3">
          <label class="premium-label">Phone Number</label>
          <div class="premium-input-wrap">
            <i class="fa-solid fa-phone"></i>
            <input type="tel" class="form-control premium-input" id="registerPhone" placeholder="09XXXXXXXXX" maxlength="11" required>
          </div>
        </div>

        <div class="premium-input-group mb-3">
          <label class="premium-label">Email Address</label>
          <div class="premium-input-wrap">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" class="form-control premium-input" id="registerEmail" placeholder="Enter email address" required>
          </div>
        </div>

        <div class="premium-input-group mb-3">
          <label class="premium-label">Username</label>
          <div class="premium-input-wrap">
            <i class="fa-solid fa-user-tag"></i>
            <input type="text" class="form-control premium-input" id="registerUsername" placeholder="Choose username" required>
          </div>
        </div>

        <div class="premium-input-group mb-3">
          <label class="premium-label">Password</label>
          <div class="premium-input-wrap">
            <i class="fa-solid fa-lock"></i>
            <input type="password" class="form-control premium-input" id="registerPassword" placeholder="Create password" required>

            <button type="button" class="password-eye-btn" data-target="registerPassword">
              <i class="fa-solid fa-eye-slash"></i>
            </button>
          </div>
        </div>

        <div class="premium-input-group mb-3">
          <label class="premium-label">Confirm Password</label>
          <div class="premium-input-wrap">
            <i class="fa-solid fa-shield-halved"></i>
            <input type="password" class="form-control premium-input" id="registerConfirmPassword" placeholder="Confirm password" required>

            <button type="button" class="password-eye-btn" data-target="registerConfirmPassword">
              <i class="fa-solid fa-eye-slash"></i>
            </button>
          </div>
        </div>

        <div class="premium-input-group mb-3">
          <label class="premium-label">Verification Method</label>

          <div class="otp-method-container">

            <label class="otp-method-card">
              <input type="radio" name="otpMethod" value="email" checked>
              <i class="fa-solid fa-envelope"></i>
              <span>Email OTP</span>
            </label>

            <label class="otp-method-card">
              <input type="radio" name="otpMethod" value="sms">
              <i class="fa-solid fa-mobile-screen"></i>
              <span>SMS OTP</span>
            </label>

          </div>
        </div>

        <p class="small text-secondary mb-2">
          Password must contain uppercase, lowercase, number, special character,
          and minimum 8 characters.
        </p>

        <p id="userRegisterMessage" class="small text-center mb-3"></p>

        <div class="d-grid mb-3">
          <button type="submit" class="premium-main-btn">
            Get Started
          </button>
        </div>

        <p class="text-center text-light mb-0">
          Already have an account?
          <a href="user-login.html" class="gold-link fw-semibold">Sign In</a>
        </p>

        <div class="text-center mt-3">
          <a href="index.html" class="back-home-link">
            ← Back to Home
          </a>
        </div>

      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="admin/js/script.js"></script>

</body>
</html>
