<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JCN | Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-page">

  <div class="auth-overlay"></div>

  <div class="container min-vh-100 d-flex justify-content-center align-items-center py-4 position-relative">
    <div class="premium-auth-card p-4 p-md-5 w-100">
      <div class="text-center mb-4">
        <img src="logo.png" alt="JCN Logo" class="auth-logo mb-3">
        <p class="auth-brand-mini mb-2">JCN APPAREL PRINTING SERVICES</p>
        <h1 class="premium-auth-title">CREATE ACCOUNT</h1>
        <p class="premium-auth-subtitle mb-0">Register to start customizing, uploading, and ordering your apparel designs.</p>
      </div>

      <form id="userRegisterForm">
        <div class="premium-input-group mb-3">
          <label class="premium-label">Full Name</label>
          <div class="premium-input-wrap">
            <i class="fa-solid fa-id-card"></i>
            <input type="text" class="form-control premium-input" id="registerFullName" placeholder="Enter full name">
          </div>
        </div>

        <div class="premium-input-group mb-3">
          <label class="premium-label">Email Address</label>
          <div class="premium-input-wrap">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" class="form-control premium-input" id="registerEmail" placeholder="Enter email">
          </div>
        </div>

        <div class="premium-input-group mb-3">
          <label class="premium-label">Username</label>
          <div class="premium-input-wrap">
            <i class="fa-solid fa-user"></i>
            <input type="text" class="form-control premium-input" id="registerUsername" placeholder="Choose username">
          </div>
        </div>

        <div class="premium-input-group mb-3">
          <label class="premium-label">Password</label>
          <div class="premium-input-wrap">
            <i class="fa-solid fa-lock"></i>
            <input type="password" class="form-control premium-input" id="registerPassword" placeholder="Create password">

            <button type="button" class="toggle-password" data-target="registerPassword">
      <i class="fa-solid fa-eye"></i>
    </button>
          </div>
        </div>

        <div class="premium-input-group mb-3">
  <label class="premium-label">Confirm Password</label>
  <div class="premium-input-wrap">
    <i class="fa-solid fa-shield-halved"></i>
    <input type="password" class="form-control premium-input" id="registerConfirmPassword" placeholder="Confirm password">

     <button type="button" class="toggle-password" data-target="registerConfirmPassword">
      <i class="fa-solid fa-eye"></i>
    </button>
  </div>
</div>

        <p id="userRegisterMessage" class="small text-center mb-3"></p>

        <div class="d-grid mb-3">
          <button type="submit" class="premium-main-btn">Get Started</button>
        </div>

        <p class="text-center text-light mb-0">
          Already have an account?
          <a href="user-login.html" class="gold-link fw-semibold">Sign In</a>
        </p>

        <div class="text-center mt-3">
          <a href="index.html" class="back-home-link">← Back to Home</a>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
