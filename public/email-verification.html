<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Email Verification - JCN Apparel
  </title>

  <link
    rel="stylesheet"
    href="./email-verification.css"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  >
</head>

<body>

  <div class="verification-container">

    <div class="verification-card">

      <!-- LOGO -->
      <div class="logo-container">
        <div class="logo-placeholder">
          JCN
        </div>
      </div>

      <p class="company-name">
        JCN Apparel Printing Services
      </p>

      <!-- ICON -->
      <div class="icon-circle">
        <i
          class="fa-solid fa-envelope-circle-check"
          aria-hidden="true"
        ></i>
      </div>

      <!-- TITLE -->
      <h2 class="title">
        Verify Your Email
      </h2>

      <p class="description">
        Enter the 6-digit verification code
        sent to your email address.
      </p>

      <!-- EMAIL -->
      <p
        class="email-text"
        id="emailText"
      >
        Loading email...
      </p>

      <!-- OTP FORM -->
      <form id="otpForm">

        <div class="otp-inputs">

          <input
            type="text"
            maxlength="1"
            inputmode="numeric"
            class="otp-box"
            autocomplete="one-time-code"
          >

          <input
            type="text"
            maxlength="1"
            inputmode="numeric"
            class="otp-box"
            autocomplete="off"
          >

          <input
            type="text"
            maxlength="1"
            inputmode="numeric"
            class="otp-box"
            autocomplete="off"
          >

          <input
            type="text"
            maxlength="1"
            inputmode="numeric"
            class="otp-box"
            autocomplete="off"
          >

          <input
            type="text"
            maxlength="1"
            inputmode="numeric"
            class="otp-box"
            autocomplete="off"
          >

          <input
            type="text"
            maxlength="1"
            inputmode="numeric"
            class="otp-box"
            autocomplete="off"
          >

        </div>

        <!-- MESSAGE -->
        <p
          id="otpMessage"
          class="otp-message"
        ></p>

        <!-- VERIFY -->
        <button
          type="submit"
          id="verifyOtpBtn"
          class="verify-btn"
        >
          Verify Code
        </button>

      </form>

      <!-- RESEND -->
      <button
        type="button"
        id="resendOtpBtn"
        class="resend-btn"
      >
        Resend Code
      </button>

      <!-- BACK -->
      <a
        href="./index.html"
        class="back-link"
      >
        <i
          class="fa-solid fa-arrow-left"
        ></i>

        Back to Home
      </a>

    </div>

  </div>

  <script>
    document.addEventListener(
      "DOMContentLoaded",
      () => {

        const API_URL =
          "http://localhost:5000/api/auth";

        // =========================================
        // ELEMENTS
        // =========================================

        const emailText =
          document.getElementById(
            "emailText"
          );

        const otpForm =
          document.getElementById(
            "otpForm"
          );

        const otpInputs =
          document.querySelectorAll(
            ".otp-box"
          );

        const otpMessage =
          document.getElementById(
            "otpMessage"
          );

        const verifyOtpBtn =
          document.getElementById(
            "verifyOtpBtn"
          );

        const resendOtpBtn =
          document.getElementById(
            "resendOtpBtn"
          );

        // =========================================
        // MESSAGE HELPER
        // =========================================

        function showMessage(
          message,
          type = "info"
        ) {
          otpMessage.textContent =
            message;

          if (type === "success") {
            otpMessage.style.color =
              "#9cffb0";
          } else if (
            type === "error"
          ) {
            otpMessage.style.color =
              "#ff8b8b";
          } else {
            otpMessage.style.color =
              "#ffcc36";
          }
        }

        // =========================================
        // GET EMAIL
        // =========================================

        let verificationEmail =
          sessionStorage.getItem(
            "verifyEmail"
          ) ||
          localStorage.getItem(
            "verifyEmail"
          );

        // =========================================
        // GET PENDING REGISTRATION
        // =========================================

        let pendingRegistration =
          null;

        try {
          const pendingRaw =
            sessionStorage.getItem(
              "pendingRegistration"
            ) ||
            localStorage.getItem(
              "pendingRegistration"
            );

          if (pendingRaw) {
            pendingRegistration =
              JSON.parse(
                pendingRaw
              );
          }
        } catch (error) {
          console.error(
            "PENDING REGISTRATION PARSE ERROR:",
            error
          );
        }

        // =========================================
        // FALLBACK EMAIL
        // =========================================

        if (
          !verificationEmail &&
          pendingRegistration?.email
        ) {
          verificationEmail =
            String(
              pendingRegistration.email
            )
              .trim()
              .toLowerCase();

          sessionStorage.setItem(
            "verifyEmail",
            verificationEmail
          );

          localStorage.setItem(
            "verifyEmail",
            verificationEmail
          );
        }

        console.log(
          "VERIFY EMAIL:",
          verificationEmail
        );

        console.log(
          "PENDING REGISTRATION:",
          pendingRegistration
        );

        // =========================================
        // NO EMAIL FOUND
        // =========================================

        if (!verificationEmail) {
          emailText.textContent =
            "No email found. Please register again.";

          showMessage(
            "Registration session was not found.",
            "error"
          );

          verifyOtpBtn.disabled =
            true;

          resendOtpBtn.disabled =
            true;

          return;
        }

        // =========================================
        // SHOW EMAIL
        // =========================================

        emailText.textContent =
          verificationEmail;

        // =========================================
        // OTP AUTO MOVE
        // =========================================

        otpInputs.forEach(
          (input, index) => {

            input.addEventListener(
              "input",
              () => {

                // numbers only
                input.value =
                  input.value
                    .replace(
                      /\D/g,
                      ""
                    )
                    .slice(
                      0,
                      1
                    );

                // move next
                if (
                  input.value &&
                  index <
                    otpInputs.length - 1
                ) {
                  otpInputs[
                    index + 1
                  ].focus();
                }
              }
            );

            // =====================================
            // BACKSPACE
            // =====================================

            input.addEventListener(
              "keydown",
              event => {

                if (
                  event.key ===
                    "Backspace" &&
                  !input.value &&
                  index > 0
                ) {
                  otpInputs[
                    index - 1
                  ].focus();
                }

                if (
                  event.key ===
                    "ArrowLeft" &&
                  index > 0
                ) {
                  otpInputs[
                    index - 1
                  ].focus();
                }

                if (
                  event.key ===
                    "ArrowRight" &&
                  index <
                    otpInputs.length - 1
                ) {
                  otpInputs[
                    index + 1
                  ].focus();
                }
              }
            );

            // =====================================
            // PASTE FULL OTP
            // =====================================

            input.addEventListener(
              "paste",
              event => {

                event.preventDefault();

                const pasted =
                  event.clipboardData
                    .getData(
                      "text"
                    )
                    .replace(
                      /\D/g,
                      ""
                    )
                    .slice(
                      0,
                      6
                    );

                pasted
                  .split("")
                  .forEach(
                    (
                      digit,
                      position
                    ) => {

                      if (
                        otpInputs[
                          position
                        ]
                      ) {
                        otpInputs[
                          position
                        ].value =
                          digit;
                      }
                    }
                  );

                const lastIndex =
                  Math.min(
                    pasted.length,
                    otpInputs.length
                  ) - 1;

                if (
                  lastIndex >= 0
                ) {
                  otpInputs[
                    lastIndex
                  ].focus();
                }
              }
            );
          }
        );

        // Focus first OTP box
        if (
          otpInputs.length > 0
        ) {
          otpInputs[0].focus();
        }

        // =========================================
        // GET OTP
        // =========================================

        function getOtp() {
          return Array.from(
            otpInputs
          )
            .map(
              input =>
                input.value.trim()
            )
            .join("");
        }

        // =========================================
        // CLEAR OTP
        // =========================================

        function clearOtp() {
          otpInputs.forEach(
            input => {
              input.value = "";
            }
          );

          if (
            otpInputs.length
          ) {
            otpInputs[0].focus();
          }
        }

        // =========================================
        // RESEND OTP
        // =========================================

        resendOtpBtn.addEventListener(
          "click",
          async () => {

            if (
              !verificationEmail
            ) {
              showMessage(
                "No email found. Please register again.",
                "error"
              );

              return;
            }

            const oldText =
              resendOtpBtn.textContent;

            resendOtpBtn.disabled =
              true;

            resendOtpBtn.textContent =
              "Sending...";

            showMessage(
              "Sending a new verification code...",
              "info"
            );

            try {

              const response =
                await fetch(
                  `${API_URL}/resend-otp`,
                  {
                    method:
                      "POST",

                    headers: {
                      "Content-Type":
                        "application/json"
                    },

                    body:
                      JSON.stringify(
                        {
                          email:
                            verificationEmail
                        }
                      )
                  }
                );

              const data =
                await response.json();

              console.log(
                "RESEND RESPONSE:",
                data
              );

              if (
                !response.ok ||
                data.success !==
                  true
              ) {
                showMessage(
                  data.message ||
                    "Unable to resend verification code.",
                  "error"
                );

                return;
              }

              showMessage(
                data.message ||
                  "A new verification code has been sent.",
                "success"
              );

              clearOtp();

            } catch (
              error
            ) {

              console.error(
                "RESEND OTP ERROR:",
                error
              );

              showMessage(
                "Cannot connect to the server.",
                "error"
              );

            } finally {

              resendOtpBtn.disabled =
                false;

              resendOtpBtn.textContent =
                oldText;
            }
          }
        );

        // =========================================
        // VERIFY OTP
        // =========================================

        otpForm.addEventListener(
          "submit",
          async event => {

            event.preventDefault();

            const otp =
              getOtp();

            if (
              !/^\d{6}$/.test(
                otp
              )
            ) {
              showMessage(
                "Please enter the complete 6-digit verification code.",
                "error"
              );

              return;
            }

            verifyOtpBtn.disabled =
              true;

            verifyOtpBtn.textContent =
              "Verifying...";

            showMessage(
              "Checking verification code...",
              "info"
            );

            try {

              // ===================================
              // STEP 1: VERIFY OTP
              // ===================================

              const verifyResponse =
                await fetch(
                  `${API_URL}/verify-otp`,
                  {
                    method:
                      "POST",

                    headers: {
                      "Content-Type":
                        "application/json"
                    },

                    body:
                      JSON.stringify(
                        {
                          email:
                            verificationEmail,

                          otp:
                            otp
                        }
                      )
                  }
                );

              const verifyData =
                await verifyResponse.json();

              console.log(
                "VERIFY RESPONSE:",
                verifyData
              );

              if (
                !verifyResponse.ok ||
                verifyData.success !==
                  true
              ) {
                showMessage(
                  verifyData.message ||
                    "Invalid verification code.",
                  "error"
                );

                return;
              }

              // ===================================
              // CHECK PENDING REGISTRATION
              // ===================================

              if (
                !pendingRegistration
              ) {
                showMessage(
                  "Email verified, but registration information was not found. Please register again.",
                  "error"
                );

                return;
              }

              showMessage(
                "Email verified. Creating your account...",
                "success"
              );

              // ===================================
              // STEP 2: REGISTER CUSTOMER
              // ===================================

              const registerResponse =
                await fetch(
                  `${API_URL}/register`,
                  {
                    method:
                      "POST",

                    headers: {
                      "Content-Type":
                        "application/json"
                    },

                    body:
                      JSON.stringify(
                        {
                          firstName:
                            pendingRegistration.firstName,

                          middleName:
                            pendingRegistration.middleName ||
                            "",

                          lastName:
                            pendingRegistration.lastName,

                          phone:
                            pendingRegistration.phone,

                          email:
                            pendingRegistration.email,

                          username:
                            pendingRegistration.username,

                          password:
                            pendingRegistration.password,

                          otp:
                            otp
                        }
                      )
                  }
                );

              const registerData =
                await registerResponse.json();

              console.log(
                "REGISTER RESPONSE:",
                registerData
              );

              if (
                !registerResponse.ok ||
                registerData.success !==
                  true
              ) {
                showMessage(
                  registerData.message ||
                    "Unable to create account.",
                  "error"
                );

                return;
              }

              // ===================================
              // SUCCESS
              // ===================================

              showMessage(
                "Registration successful! Redirecting to login...",
                "success"
              );

              // Remove registration temporary data
              sessionStorage.removeItem(
                "verifyEmail"
              );

              localStorage.removeItem(
                "verifyEmail"
              );

              sessionStorage.removeItem(
                "pendingRegistration"
              );

              localStorage.removeItem(
                "pendingRegistration"
              );

              // Remove old legacy keys too
              localStorage.removeItem(
                "pendingEmail"
              );

              localStorage.removeItem(
                "pendingFirstName"
              );

              localStorage.removeItem(
                "pendingMiddleName"
              );

              localStorage.removeItem(
                "pendingLastName"
              );

              localStorage.removeItem(
                "pendingPhone"
              );

              localStorage.removeItem(
                "pendingUsername"
              );

              localStorage.removeItem(
                "pendingPassword"
              );

              setTimeout(
                () => {

                  window.location.href =
                    "./customer/html/user-login.html";

                },
                1000
              );

            } catch (
              error
            ) {

              console.error(
                "VERIFY / REGISTER ERROR:",
                error
              );

              showMessage(
                "Cannot connect to the server.",
                "error"
              );

            } finally {

              verifyOtpBtn.disabled =
                false;

              verifyOtpBtn.textContent =
                "Verify Code";
            }
          }
        );

      }
    );
  </script>

</body>
</html>
