<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JCN | Admin Login</title>

  <!-- BOOTSTRAP -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- FONT AWESOME -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- JCN CSS -->
  <link rel="stylesheet" href="../css/style.css">
</head>

<body class="auth-page">

  <div class="auth-overlay"></div>

  <div class="container min-vh-100 d-flex justify-content-center align-items-center py-4 position-relative">

    <div class="premium-auth-card p-4 p-md-5 w-100">

      <!-- HEADER -->
      <div class="text-center mb-4">

        <img src="../../logo.png" alt="JCN Logo" class="auth-logo mb-3">

        <p class="auth-brand-mini mb-2">
          JCN APPAREL PRINTING SERVICES
        </p>

        <h1 class="premium-auth-title">
          ADMIN SIGN IN
        </h1>

        <p class="premium-auth-subtitle mb-0">
          Login as administrator to manage orders, customers, and printing services.
        </p>

      </div>

      <!-- LOGIN FORM -->
      <form id="adminLoginForm">

        <!-- USERNAME -->
        <div class="premium-input-group mb-3">

          <label for="adminUsername" class="premium-label">
            Admin Username
          </label>

          <div class="premium-input-wrap">

            <i class="fa-solid fa-user-shield"></i>

            <input
              type="text"
              class="form-control premium-input"
              id="adminUsername"
              name="username"
              placeholder="Enter admin username"
              autocomplete="username"
              required
            >

          </div>

        </div>

        <!-- PASSWORD -->
        <div class="premium-input-group mb-3">

          <label for="adminPassword" class="premium-label">
            Password
          </label>

          <div class="premium-input-wrap">

            <i class="fa-solid fa-lock"></i>

            <input
              type="password"
              class="form-control premium-input"
              id="adminPassword"
              name="password"
              placeholder="Enter password"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="password-eye-btn"
              data-target="adminPassword"
              aria-label="Show or hide password"
            >
              <i class="fa-solid fa-eye"></i>
            </button>

          </div>

        </div>

        <!-- LOGIN OPTIONS -->
        <div class="admin-login-options">

          <div class="admin-portal-links">

            <!-- USER LOGIN -->
            <a
              href="../../customer/html/user-login.html"
              class="admin-login-link"
            >
              <i class="fa-solid fa-user"></i>
              <span>User Login</span>
            </a>

            <span class="admin-login-divider"></span>

            <!-- STAFF LOGIN -->
<a
              href="../../staff/html/staff-login.html"
              class="admin-login-link"
            >
              <i class="fa-solid fa-users-gear"></i>
              <span>Staff Login</span>
            </a>

          </div>

          <!-- FORGOT PASSWORD -->
          <a
            href="#"
            id="adminForgotPasswordBtn"
            class="admin-login-link admin-forgot-link"
          >
            Forgot Password?
          </a>

        </div>

        <!-- LOGIN MESSAGE -->
        <p id="adminLoginMessage" class="small text-center mb-3"></p>

        <!-- SIGN IN -->
        <div class="d-grid mb-3">

          <button type="submit" class="premium-main-btn">
            <i class="fa-solid fa-right-to-bracket me-2"></i>
            Admin Sign In
          </button>

        </div>

        <!-- BACK HOME -->
        <div class="text-center mt-3">

          <a href="../../index.html" class="back-home-link">
            <i class="fa-solid fa-arrow-left me-1"></i>
            Back to Home
          </a>

        </div>

      </form>

    </div>

  </div>


  <!-- RESET PASSWORD MODAL -->
  <div id="resetModal" class="reset-modal hidden">

    <div class="reset-box">

      <h2>Reset Password</h2>

      <p id="resetText">
        Enter your admin email to receive OTP.
      </p>

      <input
        type="email"
        id="resetEmail"
        placeholder="Admin email"
        autocomplete="email"
      >

      <input
        type="text"
        id="resetOtp"
        class="hidden"
        placeholder="Enter OTP"
        inputmode="numeric"
        autocomplete="one-time-code"
      >

      <input
        type="password"
        id="resetNewPassword"
        class="hidden"
        placeholder="New password"
        autocomplete="new-password"
      >

      <input
        type="password"
        id="resetConfirmPassword"
        class="hidden"
        placeholder="Confirm password"
        autocomplete="new-password"
      >

      <p id="resetMessage"></p>

      <div class="reset-actions">

        <button type="button" id="cancelResetBtn">
          Cancel
        </button>

        <button type="button" id="resetNextBtn">
          Send OTP
        </button>

      </div>

    </div>

  </div>


  <!-- SUCCESS MODAL -->
  <div id="successModal" class="success-modal hidden">

    <div class="success-box">

      <div class="success-icon">
        <i class="fa-solid fa-check"></i>
      </div>

      <h2>Success</h2>

      <p id="successText">
        Password reset successful. You can now login.
      </p>

      <button type="button" id="successOkBtn">
        Continue
      </button>

    </div>

  </div>


  <!-- ADMIN JAVASCRIPT -->
  <script src="../js/script.js"></script>

</body>

</html>
