
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JCN | Management Login</title>

  <!-- BOOTSTRAP -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- FONT AWESOME -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  >

  <!-- EXISTING JCN CSS -->
  <link rel="stylesheet" href="../css/style.css">

</head>

<body class="auth-page" data-page="management-login">

  <!-- BACKGROUND OVERLAY -->
  <div class="auth-overlay" aria-hidden="true"></div>

  <!-- LOGIN CONTAINER -->
  <main
    class="container min-vh-100 d-flex justify-content-center align-items-center py-4 position-relative"
  >

    <!-- LOGIN CARD -->
    <div class="premium-auth-card p-4 p-md-5 w-100">

      <!-- HEADER -->
      <div class="text-center mb-4">

        <img
          src="../../logo.png"
          alt="JCN Apparel Logo"
          class="auth-logo mb-3"
        >

        <p class="auth-brand-mini mb-2">
          JCN APPAREL PRINTING SERVICES
        </p>

        <h1 class="premium-auth-title">
          MANAGEMENT LOGIN
        </h1>

        <p class="premium-auth-subtitle mb-0">
          Secure access for authorized administrators and staff.
        </p>

      </div>

      <!-- LOGIN FORM -->
      <form id="adminLoginForm" method="post">

        <!-- USERNAME -->
        <div class="premium-input-group mb-3">

          <label for="adminUsername" class="premium-label">
            Username
          </label>

          <div class="premium-input-wrap">

            <i
              class="fa-solid fa-user-shield"
              aria-hidden="true"
            ></i>

            <input
              type="text"
              class="form-control premium-input"
              id="adminUsername"
              name="username"
              placeholder="Enter your username"
              autocomplete="username"
              autocapitalize="none"
              spellcheck="false"
              required
            >

          </div>

        </div>

        <!-- PASSWORD -->
        <div class="premium-input-group mb-3">

          <label for="adminPassword" class="premium-label">
            Password
          </label>

          <div class="premium-input-wrap">

            <i
              class="fa-solid fa-lock"
              aria-hidden="true"
            ></i>

            <input
              type="password"
              class="form-control premium-input"
              id="adminPassword"
              name="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >

            <!-- PASSWORD VISIBILITY -->
            <button
              type="button"
              class="password-eye-btn"
              data-target="adminPassword"
              aria-label="Show or hide password"
              aria-controls="adminPassword"
            >
              <i
                class="fa-solid fa-eye"
                aria-hidden="true"
              ></i>
            </button>

          </div>

        </div>

          <a
    href="../../staff/html/staff-login.html"
    class="gold-link small fw-semibold admin-login-link"
  >
    <i class="fa-solid fa-users-gear me-1" aria-hidden="true"></i>
    Staff Login
  </a>

        <!-- FORGOT PASSWORD -->
        <div class="d-flex justify-content-end mb-3">

          <a
            href="#resetModal"
            id="adminForgotPasswordBtn"
            class="gold-link small fw-semibold admin-forgot-link"
          >
            Forgot Password?
          </a>

        </div>

        <!-- LOGIN MESSAGE -->
        <p
          id="adminLoginMessage"
          class="small text-center mb-3"
          role="status"
          aria-live="polite"
        ></p>

        <!-- SIGN IN -->
        <div class="d-grid mb-3">

          <button
            type="submit"
            class="premium-main-btn"
          >
            <i
              class="fa-solid fa-right-to-bracket me-2"
              aria-hidden="true"
            ></i>
            Sign In
          </button>

        </div>

        <!-- BACK HOME -->
        <div class="text-center mt-3">

          <a
            href="../../index.html"
            class="back-home-link"
          >
            <i
              class="fa-solid fa-arrow-left me-1"
              aria-hidden="true"
            ></i>
            Back to Home
          </a>

        </div>

      </form>

    </div>

  </main>

  <!-- ADMIN RESET PASSWORD MODAL -->
  <div
    id="resetModal"
    class="reset-modal hidden"
    role="dialog"
    aria-modal="true"
    aria-labelledby="resetModalTitle"
    aria-hidden="true"
  >

    <div class="reset-box">

      <h2 id="resetModalTitle">
        Reset Password
      </h2>

      <p id="resetText">
        Enter your registered admin email to receive OTP.
      </p>

      <!-- EMAIL -->
      <input
        type="email"
        id="resetEmail"
        placeholder="Admin email"
        autocomplete="email"
      >

      <!-- OTP -->
      <input
        type="text"
        id="resetOtp"
        class="hidden"
        placeholder="Enter OTP"
        inputmode="numeric"
        autocomplete="one-time-code"
      >

      <!-- NEW PASSWORD -->
      <input
        type="password"
        id="resetNewPassword"
        class="hidden"
        placeholder="New password"
        autocomplete="new-password"
      >

      <!-- CONFIRM PASSWORD -->
      <input
        type="password"
        id="resetConfirmPassword"
        class="hidden"
        placeholder="Confirm password"
        autocomplete="new-password"
      >

      <!-- MESSAGE -->
      <p
        id="resetMessage"
        role="status"
        aria-live="polite"
      ></p>

      <!-- RESET ACTIONS -->
      <div class="reset-actions">

        <button
          type="button"
          id="cancelResetBtn"
        >
          Cancel
        </button>

        <button
          type="button"
          id="resetNextBtn"
        >
          Send OTP
        </button>

      </div>

    </div>

  </div>

  <!-- RESET SUCCESS MODAL -->
  <div
    id="successModal"
    class="success-modal hidden"
    role="dialog"
    aria-modal="true"
    aria-labelledby="successModalTitle"
    aria-hidden="true"
  >

    <div class="success-box">

      <div class="success-icon">
        <i
          class="fa-solid fa-check"
          aria-hidden="true"
        ></i>
      </div>

      <h2 id="successModalTitle">
        Success
      </h2>

      <p id="successText">
        Password reset successful. You can now login.
      </p>

      <button
        type="button"
        id="successOkBtn"
      >
        Continue
      </button>

    </div>

  </div>

  <!-- EXISTING SHARED FUNCTIONS -->
  <script src="../js/script.js"></script>

  <!-- MANAGEMENT LOGIN HANDLER -->
  <script src="../js/management-login.js"></script>

</body>
</html>
