<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Staff Login | JCN Apparel</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  >

  <!-- Staff Login CSS -->
  <link rel="stylesheet" href="../css/staff-login.css">
</head>

<body>

  <main class="login-page">

    <div class="login-card">

      <!-- ==========================================
           BRAND / HEADER
      =========================================== -->
      <div class="brand-section">

        <div class="brand-icon">
          <i class="fa-solid fa-shirt"></i>
        </div>

        <p class="brand-label">
          JCN APPAREL
        </p>

        <h1>
          Staff Portal
        </h1>

        <p class="brand-description">
          Secure access for JCN Inventory Staff,
          Graphic Designers, and Cashiers.
        </p>

      </div>


      <!-- ==========================================
           STAFF LOGIN FORM
      =========================================== -->
      <form id="staffLoginForm" autocomplete="on">

        <!-- USERNAME -->
        <div class="form-group">

          <label for="username">
            Username
          </label>

          <div class="input-box">

            <i class="fa-solid fa-user input-icon"></i>

            <input
              type="text"
              id="username"
              name="username"
              placeholder="Enter your username"
              autocomplete="username"
              required
            >

          </div>

        </div>


        <!-- PASSWORD -->
        <div class="form-group">

          <label for="password">
            Password
          </label>

          <div class="input-box">

            <i class="fa-solid fa-lock input-icon"></i>

            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >

            <button
  type="button"
  id="togglePassword"
  class="password-toggle"
  aria-label="Show password"
>
  <i class="fa-solid fa-eye"></i>
</button>

          </div>

        </div>


        <!-- LOGIN MESSAGE -->
        <p
          id="loginMessage"
          class="login-message"
          aria-live="polite"
        ></p>


        <!-- SIGN IN -->
        <button
          type="submit"
          id="loginButton"
          class="login-button"
        >

          <i class="fa-solid fa-right-to-bracket"></i>

          <span>
            Sign In
          </span>

        </button>

      </form>


      <!-- ==========================================
           PORTAL INFORMATION
      =========================================== -->
      <div class="portal-info">

        <i class="fa-solid fa-shield-halved"></i>

        <span>
          Authorized JCN staff only
        </span>

      </div>


      <!-- ==========================================
           BACK TO ADMIN LOGIN
      =========================================== -->
      <div class="back-login">

        <a href="../../admin/html/admin-login.html" class="back-login-link">

          <i class="fa-solid fa-arrow-left"></i>

          Back to Admin Login

        </a>

      </div>

    </div>

  </main>


  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- IMPORTANT:
       staff-login.js is inside the SAME staff folder -->
  <script src="../js/staff-login.js"></script>

</body>

</html>
