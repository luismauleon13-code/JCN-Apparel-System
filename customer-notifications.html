<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JCN | Notifications</title>

  <link rel="stylesheet" href="customer-notifications.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

<aside class="sidebar">
  <div class="brand">
    <div class="logo">J</div>
    <div>
      <h2>JCN</h2>
      <p>Apparel Printing</p>
    </div>
  </div>

  <nav class="menu">
    <a href="dashboard.html"><i class="fa-solid fa-house"></i> Home</a>
    <a href="customer-shop.html"><i class="fa-solid fa-shirt"></i> Shop Products</a>
    <a href="customer-customize.html"><i class="fa-solid fa-palette"></i> Customization</a>
    <a href="customer-notifications.html" class="active"><i class="fa-solid fa-bullhorn"></i> Notifications</a>
    <a href="customer-cart.html"><i class="fa-solid fa-cart-shopping"></i> Cart</a>
    <a href="customer-orders.html"><i class="fa-solid fa-box"></i> Orders</a>
    <a href="customer-profile.html"><i class="fa-solid fa-user"></i> Profile</a>
  </nav>

  <button id="logoutBtn" class="logout-btn">
    <i class="fa-solid fa-right-from-bracket"></i> Logout
  </button>
</aside>

<main class="main">
  <header class="topbar">
    <div>
      <p>JCN ANNOUNCEMENTS</p>
      <h1>Announcements</h1>
    </div>
  </header>

  <section class="announcement-layout">

    <div class="announcement-list-panel">
      <div class="panel-header">
        <h2>Latest Announcements</h2>
        <span id="announcementCount">0</span>
      </div>

      <div id="announcementList" class="announcement-list">
        <p class="empty">Loading announcements...</p>
      </div>
    </div>

    <div class="details-panel">
      <h2>Announcement Details</h2>

      <div id="announcementDetails">
        <p class="empty">
          Select an announcement to read details.
        </p>
      </div>
    </div>

  </section>
</main>

<script src="customer-notifications.js"></script>
</body>
</html>
