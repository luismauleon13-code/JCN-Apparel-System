<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JCN | Checkout</title>

  <link rel="stylesheet" href="customer-checkout.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

<aside class="sidebar">
  <div class="brand">
    <div class="logo">J</div>
    <div>
      <h2>JCN</h2>
      <p>Apparel Printing</p>
    </div>
  </div>

  <nav class="menu">
    <a href="dashboard.html"><i class="fa-solid fa-house"></i> Home</a>
    <a href="customer-shop.html"><i class="fa-solid fa-shirt"></i> Shop Products</a>
    <a href="customer-customize.html"><i class="fa-solid fa-palette"></i> Customization</a>
    <a href="customer-notifications.html"><i class="fa-solid fa-bullhorn"></i> Notifications</a>
    <a href="customer-cart.html"><i class="fa-solid fa-cart-shopping"></i> Cart</a>
    <a href="customer-orders.html"><i class="fa-solid fa-box"></i> Orders</a>
    <a href="customer-profile.html"><i class="fa-solid fa-user"></i> Profile</a>
  </nav>

  <button id="logoutBtn" class="logout-btn">
    <i class="fa-solid fa-right-from-bracket"></i> Logout
  </button>
</aside>

<main class="main">
  <header class="topbar">
    <div>
      <p>JCN CHECKOUT</p>
      <h1>Checkout</h1>
    </div>

    <a href="customer-cart.html" class="back-btn">
      <i class="fa-solid fa-arrow-left"></i> Back to Cart
    </a>
  </header>

  <section class="checkout-layout">
    <form class="checkout-panel" id="checkoutForm">
      <h2>Shipping Address</h2>

      <label>Full Name</label>
      <input type="text" id="fullName" required />

      <label>Email</label>
      <input type="email" id="email" required />

      <label>Contact Number</label>
<input type="text" id="phone" placeholder="Enter contact number">

<label>Complete Address</label>
<textarea id="address"
placeholder="Enter complete address"></textarea>

      <label>Payment Method</label>
      <select id="paymentMethod" required>
        <option value="COD">Cash on Delivery</option>
        <option value="PayPal">PayPal</option>
      </select>

      <button type="submit" class="confirm-btn">
        Confirm Order
      </button>
    </form>

    <div class="summary-panel">
      <h2>Order Summary</h2>

      <div id="orderItems" class="order-items"></div>

      <div class="summary-row">
        <span>Subtotal</span>
        <strong id="subtotal">₱0.00</strong>
      </div>

      <div class="summary-row">
        <span>Delivery Fee</span>
        <strong id="deliveryFee">₱80.00</strong>
      </div>

      <div class="summary-row total">
        <span>Total</span>
        <strong id="grandTotal">₱0.00</strong>
      </div>
    </div>
  </section>
</main>

<div class="success-modal" id="successModal">
  <div class="success-box">
    <i class="fa-solid fa-circle-check"></i>
    <h2>Order Confirmed!</h2>
    <p>Your order number is:</p>
    <h3 id="orderNumberText"></h3>
    <button id="goOrdersBtn">View My Orders</button>
  </div>
</div>

<script src="customer-checkout.js"></script>
</body>
</html>
