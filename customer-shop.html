<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JCN | Shop Products</title>

  <link rel="stylesheet" href="customer-shop.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body>

<aside class="sidebar">
  <div class="brand">
    <div class="logo">J</div>
    <div>
      <h2>JCN</h2>
      <p>Apparel Printing</p>
    </div>
  </div>

  <nav class="menu">
    <a href="dashboard.html">
      <i class="fa-solid fa-house"></i> Home
    </a>

    <a href="customer-shop.html" class="active">
      <i class="fa-solid fa-shirt"></i> Shop Products
    </a>

    <a href="customer-customize.html">
      <i class="fa-solid fa-palette"></i> Customization
    </a>

    <a href="customer-notifications.html">
      <i class="fa-solid fa-bell"></i> Notifications
    </a>

    <a href="customer-cart.html">
      <i class="fa-solid fa-cart-shopping"></i> Cart
    </a>

    <a href="customer-orders.html">
      <i class="fa-solid fa-box"></i> Orders
    </a>

    <a href="customer-profile.html">
      <i class="fa-solid fa-user"></i> Profile
    </a>
  </nav>

  <button id="logoutBtn" class="logout-btn">
    <i class="fa-solid fa-right-from-bracket"></i> Logout
  </button>
</aside>

<main class="main">
  <header class="topbar">
    <div>
      <p>JCN SHOP PAGE</p>
      <h1>Browse Products</h1>
    </div>

    <a href="customer-cart.html" class="cart-btn">
      <i class="fa-solid fa-cart-shopping"></i>
      Cart <span id="cartCount">0</span>
    </a>
  </header>

  <section class="filters">
    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="searchInput" placeholder="Search product..." />
    </div>

    <select id="categoryFilter">
      <option value="">All Categories</option>
    </select>
  </section>

  <section class="product-grid" id="productList">
    <p class="empty">Loading products...</p>
  </section>
</main>

<script src="customer-shop.js"></script>
</body>
</html>
